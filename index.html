<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOVESUMMER :)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #e0e0e0;
    font-family: Arial, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 15px;
  }
  .container {
    background-color: #f5f5f5;
    border: 2px solid #888888;
    width: 100%; max-width: 420px;
    box-shadow: 3px 3px 0px #999999;
  }
  .header {
    background: linear-gradient(180deg, #ffffff 0%, #d0d0d0 100%);
    border-bottom: 2px solid #888888; padding: 12px 15px;
  }
  .header h1 {
    font-size: 18px; color: #333333; text-align: center; font-weight: bold;
    text-shadow: 1px 1px 0px #ffffff;
  }
  .content { padding: 15px; text-align: center; }
  .timer-block {
    background: #ffffff; border: 2px inset #999999; padding: 10px; margin-bottom: 15px;
  }
  .timer-digits {
    font-family: "Courier New", monospace; font-size: 28px; color: #000;
  }
  .timer-labels {
    font-size: 12px; color: #555; margin-top: 4px;
  }
  .canvas-wrap {
    margin: 10px 0; display: flex; justify-content: center;
  }
  canvas {
    width: 160px; height: 160px; background: #e8e8e8; border: 2px inset #999;
  }
  .progress-text {
    font-size: 16px; font-weight: bold; color: #333; margin-bottom: 10px;
  }
  .footer {
    margin-top: 15px; text-align: center; font-size: 12px; color: #666;
    border-top: 1px solid #aaa; padding-top: 8px;
  }
  .footer a { color: #333; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>:) LOVESUMMER</h1>
  </div>
  <div class="content">
    <div class="timer-block">
      <div class="timer-digits" id="timer">-- : -- : -- : --</div>
      <div class="timer-labels">дни часы мин сек</div>
    </div>

    <div class="progress-text" id="progressLabel">До лета осталось: --%</div>

    <div class="canvas-wrap">
      <canvas id="progressCanvas" width="160" height="160"></canvas>
    </div>

    <div class="footer">
      сайт для старых клиентов :)))<br>
      <a href="https://t.me/lublusebya1111" target="_blank">мой Telegram-канал</a>
    </div>
  </div>
</div>

<script>
  // Московское время: UTC+3
  function getMoscowDate() {
    var now = new Date();
    var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    return new Date(utc + (3 * 3600000)); // смещение +3 часа
  }

  // Определяем ближайшее 1 июня 00:00:00 по Москве
  function getSummerTarget() {
    var now = getMoscowDate();
    var year = now.getFullYear();
    var target = new Date(year, 5, 1, 0, 0, 0); // 5 = июнь (месяцы 0-11)
    if (now >= target) {
      // Если лето уже прошло, цель – 1 июня следующего года
      target = new Date(year + 1, 5, 1, 0, 0, 0);
    }
    return target;
  }

  // Начало предыдущего лета для расчёта прогресса
  function getPrevSummer() {
    var now = getMoscowDate();
    var year = now.getFullYear();
    var thisSummer = new Date(year, 5, 1, 0, 0, 0);
    if (now < thisSummer) {
      // предыдущее лето началось год назад
      return new Date(year - 1, 5, 1, 0, 0, 0);
    } else {
      return thisSummer;
    }
  }

  function updateTimer() {
    var now = getMoscowDate();
    var target = getSummerTarget();
    var diff = target - now;

    if (diff <= 0) {
      document.getElementById('timer').innerText = 'Лето наступило!';
      document.getElementById('progressLabel').innerText = 'Сейчас лето :)';
      drawProgress(100);
      return;
    }

    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
    var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById('timer').innerText =
      (days < 10 ? '0' : '') + days + ' : ' +
      (hours < 10 ? '0' : '') + hours + ' : ' +
      (minutes < 10 ? '0' : '') + minutes + ' : ' +
      (seconds < 10 ? '0' : '') + seconds;

    // Прогресс: сколько % времени прошло от прошлого лета до следующего
    var prevSummer = getPrevSummer();
    var nextSummer = new Date(prevSummer.getFullYear() + 1, 5, 1, 0, 0, 0);
    var total = nextSummer - prevSummer;
    var elapsed = now - prevSummer;
    var percent = Math.min(100, Math.max(0, Math.floor((elapsed / total) * 100)));
    document.getElementById('progressLabel').innerText = 'До лета осталось: ' + (100 - percent) + '%';
    drawProgress(percent);
  }

  function drawProgress(percent) {
    var canvas = document.getElementById('progressCanvas');
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    var centerX = w/2, centerY = h/2;
    var radius = 65;
    var lineWidth = 12;

    // фоновое кольцо
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.strokeStyle = '#cccccc';
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    // заполненная часть (пройденное время)
    if (percent > 0) {
      ctx.beginPath();
      var startAngle = -Math.PI / 2;
      var endAngle = startAngle + (percent / 100) * 2 * Math.PI;
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.strokeStyle = '#666666';
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }

    // текст процента внутри
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#333';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(percent + '%', centerX, centerY);
  }

  setInterval(updateTimer, 1000);
  updateTimer();
</script>
</body>
</html>
